[workspace]
name = "cdmd"
version = "0.1.0"
channels = ["conda-forge", "main", "r", "msys2"]
platforms = ["linux-64"]
authors = ["AISidesKicks <198066858+AISidesKicks@users.noreply.github.com>"]

[activation]

[activation.env]
TMPDIR = "/run/user/$UID/pixi_tmp/$PIXI_PROJECT_NAME"
SCRATCH = "$PIXI_PROJECT_ROOT/scratch"

[tasks]
default = "mkdir -p /run/user/$UID/pixi_tmp/$PIXI_PROJECT_NAME"
cinematic-01-generate = "python smoketests/cinematic-01/generate.py"
cinematic-01-test = "python smoketests/cinematic-01/test.py"
cinematic-01-optimize = "python smoketests/cinematic-01/optimize.py"
cinematic-01-report = "python smoketests/cinematic-01/report.py"
toolcalling-01-test = "python smoketests/toolcalling-01/test.py"
toolcalling-01-report = "python smoketests/toolcalling-01/report.py"
toolcalling-01-sandbox = "python smoketests/toolcalling-01/test.py --executor sandbox --round-trip"
responsesapi-01-test = "python smoketests/responsesapi-01/test.py"
responsesapi-01-report = "python smoketests/responsesapi-01/report.py"

[dependencies]
python = "3.12.*"
pip = ">=26.2.1,<27"
libabseil = "==20260526.0"
libgrpc = "==1.83.0"

[pypi-dependencies]
openai = ">=2.54.0, <3"
python-dotenv = ">=1.2.3, <2"
pydantic = ">=2.13.4, <3"
deepeval = ">=4.1.10, <5"
promptfoo = ">=0.1.4, <0.2"
ragas = ">=0.4.3, <0.5"
trulens = ">=2.13.1, <3"
trulens-providers-litellm = ">=2.13.1, <3"
trulens-providers-openai = ">=2.2.2, <3"
promptrefiner = ">=1.0.0, <2"
pandas = ">=3.0.5, <4"
tenacity = ">=9.1.4, <10"
matplotlib = ">=3.11.1, <4"
seaborn = ">=0.13.2, <0.14"
datasets = ">=5.0.1, <6"
rapidfuzz = ">=3.14.5, <4"
pytest = ">=9.1.1, <10"
httpx = ">=0.28.1, <0.29"
httpx-sse = ">=0.4.3, <0.5"
asyncio = ">=4.0.0, <5"
anyio = ">=4.14.2, <5"
diskcache = ">=5.6.3, <6"
microsandbox = ">=0.6.14, <0.7"
ruff = ">=0.16.4,<0.17"
playwright = ">=1.62.0,<2"
pydantic-monty = ">=0.0.21,<0.0.22"
arize-phoenix-client = ">=3.3.0,<4"
arize-phoenix-evals = ">=2.0.0,<3"
gepa = ">=0.1.4,<0.2"
dspy = ">=3.3.1, <4"
optuna = ">=4.9.0, <5"
adalflow = ">=1.1.3, <2"
openinference-instrumentation-openai = ">=0.1.58, <0.2"
arize-phoenix-otel = ">=0.17.1, <0.18"
openinference-semantic-conventions = ">=0.1.35, <0.2"
