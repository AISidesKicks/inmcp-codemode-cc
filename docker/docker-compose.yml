name: cmod

services:
  cmod-llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: cmod-llama
    profiles: ["lab"]
    runtime: nvidia
    command:
      - "-m"
      - "/models/Q8/LFM2.5-2.6B-Q8_0.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-ngl"
      - "99"
      - "--reasoning"
      - "on"
      - "--reasoning-format"
      - "deepseek"
      - "--reasoning-preserve"
      - "--metrics"
      - "--ctx-size"
      - "65536"
      - "--parallel"
      - "1"
    volumes:
      - ./models:/models:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cmod-net

  cmod-litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: cmod-litellm
    profiles: ["lab"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-cmod-lab-81f4e2d7c9a5-master-key}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://cmod-phoenix:6006/v1/traces
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: cmod-litellm
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    depends_on:
      cmod-llama:
        condition: service_healthy
      cmod-phoenix:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cmod-net

  cmod-phoenix:
    image: arizephoenix/phoenix:latest   # document: >= 19.0 for /mcp
    container_name: cmod-phoenix
    profiles: ["lab", "phoenix"]
    environment:
      PHOENIX_WORKING_DIR: /phoenix/data
      PHOENIX_ENABLE_MCP_SERVER: "true"   # default true; kept explicit
      PHOENIX_ENABLE_MCP_CODE_MODE: "true" # default true; agents can run sandboxed code
    volumes:
      - cmod-phoenix-data:/phoenix/data
    ports:
      - "6006:6006"   # UI + OTLP HTTP (/v1/traces) + MCP (/mcp)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/v1/health')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cmod-net

networks:
  cmod-net:
    name: cmod-net

volumes:
  cmod-phoenix-data:
    name: cmod-phoenix-data